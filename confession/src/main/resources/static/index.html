<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnonConfess</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>AnonConfess</h1>

        <nav id="authNav">

            <!-- Notifications -->
            <div class="notification-wrapper">
                <button id="notificationButton">
                    🔔
                    <span id="notificationCount"></span>
                </button>

                <div id="notificationBox" class="notification-box">
                    <p>Loading notifications...</p>
                </div>
            </div>

        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Say it anonymously.</h2>
            <p>Share your thoughts, stories, fears and confessions.</p>
        </section>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search confessions...">
            <button id="searchButton">🔎 Search</button>
        </div>

        <section class="categories">
            <button onclick="loadPosts('all')">All</button>
            <button onclick="loadPosts('horror')">Horror</button>
            <button onclick="loadPosts('advice')">Advice</button>
            <button onclick="loadPosts('motivation')">Motivation</button>
            <button onclick="loadPosts('funny')">Funny</button>
        </section>

        <section id="posts">
            <p>Loading posts...</p>
        </section>
    </main>

    <script src="/js/app.js?v=15"></script>
</body>

</html>
