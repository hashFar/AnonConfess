<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - AnonConfess</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <h1 onclick="window.location.href='/'" style="cursor: pointer;">
        AnonConfess
    </h1>

    <nav>
        <button onclick="window.location.href='/'">Home</button>
        <button id="logoutButton">Logout</button>
    </nav>
</header>

<main>
    <section class="auth-container create-post-container">
        <h2>Share Your Confession</h2>
        <p>Your identity will not be shown publicly.</p>

        <form id="createPostForm">

            <textarea
                id="content"
                placeholder="What's on your mind?"
                required
            ></textarea>

            <select id="category">
                <option value="">General</option>
                <option value="Horror">Horror</option>
                <option value="Advice">Advice</option>
                <option value="Motivation">Motivation</option>
                <option value="Funny">Funny</option>
            </select>

            <button type="submit">Post Confession</button>
        </form>

        <p id="message"></p>
    </section>
</main>

<script src="/js/create-post.js?v=1"></script>

</body>
</html>
